<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>着物詳細</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: #faf8f5;
      color: #2c2c2c;
    }

    /* ── ヘッダー ── */
    header {
      background: #fff;
      border-bottom: 1px solid #e8e0d8;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #8b1a2f;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      padding: 4px 0;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .back-btn::before {
      content: '←';
      font-size: 1rem;
    }

    header h1 {
      font-family: 'Noto Serif JP', serif;
      font-size: 1rem;
      font-weight: 600;
      color: #2c2c2c;
      letter-spacing: 0.1em;
    }

    /* ── 詳細コンテンツ ── */
    .detail-gallery {
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    .detail-main-wrap {
      position: relative;
      cursor: zoom-in;
    }

    .detail-img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      display: block;
    }

    .detail-main-wrap::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #b8963e, transparent);
    }

    /* ── ライトボックス ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox-img {
      max-width: 95vw;
      max-height: 95vh;
      object-fit: contain;
      display: block;
    }

    .lightbox-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
    }

    .detail-thumbnails {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      overflow-x: auto;
      scrollbar-width: none;
      background: #fff;
    }

    .detail-thumbnails::-webkit-scrollbar { display: none; }

    .detail-thumb {
      flex: 0 0 64px;
      height: 64px;
      object-fit: cover;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.15s;
    }

    .detail-thumb.active {
      border-color: #8b1a2f;
    }

    .detail-body {
      padding: 24px 16px 40px;
      max-width: 480px;
      margin: 0 auto;
    }

    .detail-category {
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      color: #b8963e;
      margin-bottom: 8px;
    }

    .detail-name {
      font-family: 'Noto Serif JP', serif;
      font-size: 1.3rem;
      font-weight: 600;
      color: #2c2c2c;
      letter-spacing: 0.06em;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .detail-description {
      font-size: 0.85rem;
      color: #555;
      line-height: 1.9;
      white-space: pre-line;
      margin-bottom: 16px;
      padding: 12px 14px;
      background: #f7f3ee;
      border-left: 3px solid #b8963e;
    }

    .detail-id {
      font-size: 0.75rem;
      color: #bbb;
      letter-spacing: 0.05em;
    }

    .not-found {
      text-align: center;
      padding: 60px 20px;
      color: #999;
      font-family: 'Noto Serif JP', serif;
    }
  </style>
</head>
<body>
  <header>
    <button class="back-btn" onclick="history.back()">一覧に戻る</button>
    <h1>着物詳細</h1>
  </header>

  <div id="content"></div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">×</button>
    <img class="lightbox-img" id="lightboxImg" src="" alt="">
  </div>

  <script>
    function esc(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function main() {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');

      const res = await fetch('kimono.json');
      const items = await res.json();
      const item = items.find(i => i.id === id);

      const content = document.getElementById('content');

      if (!item) {
        content.innerHTML = '<div class="not-found">着物が見つかりませんでした。</div>';
        return;
      }

      document.title = item.name + ' | 着物レンタル';

      const images = item.images && item.images.length ? item.images : [item.image];
      const thumbsHtml = images.length > 1
        ? `<div class="detail-thumbnails">
            ${images.map((src, i) =>
              `<img class="detail-thumb${i === 0 ? ' active' : ''}" src="${esc(src)}" alt="${esc(item.name)} ${i+1}">`
            ).join('')}
           </div>`
        : '';
      const descHtml = item.description
        ? `<div class="detail-description">${esc(item.description)}</div>`
        : '';

      content.innerHTML = `
        <div class="detail-gallery">
          <div class="detail-main-wrap" id="mainWrap">
            <img class="detail-img" id="mainImg" src="${esc(images[0])}" alt="${esc(item.name)}">
          </div>
          ${thumbsHtml}
        </div>
        <div class="detail-body">
          <div class="detail-category">${esc(item.category)}</div>
          <div class="detail-name">${esc(item.name)}</div>
          ${descHtml}
        </div>
      `;

      let currentIdx = 0;

      // サムネイルクリックでメイン画像を切り替え
      document.querySelectorAll('.detail-thumb').forEach((thumb, i) => {
        thumb.addEventListener('click', () => {
          currentIdx = i;
          document.getElementById('mainImg').src = images[i];
          document.querySelectorAll('.detail-thumb').forEach(t => t.classList.remove('active'));
          thumb.classList.add('active');
        });
      });

      // ライトボックス
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightboxImg');

      function openLightbox() {
        lightboxImg.src = images[currentIdx];
        lightboxImg.alt = item.name;
        lightbox.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        lightbox.classList.remove('open');
        document.body.style.overflow = '';
      }

      function showLightboxAt(idx) {
        currentIdx = idx;
        lightboxImg.src = images[currentIdx];
        lightboxImg.alt = item.name;
        document.querySelectorAll('.detail-thumb').forEach((t, i) => t.classList.toggle('active', i === currentIdx));
        document.getElementById('mainImg').src = images[currentIdx];
      }

      document.getElementById('mainWrap').addEventListener('click', openLightbox);
      document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

      // キーボード操作
      document.addEventListener('keydown', e => {
        if (!lightbox.classList.contains('open')) return;
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowRight') showLightboxAt((currentIdx + 1) % images.length);
        if (e.key === 'ArrowLeft') showLightboxAt((currentIdx - 1 + images.length) % images.length);
      });

      // タッチスワイプ
      let touchStartX = 0;
      lightbox.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive: true});
      lightbox.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) < 40) return;
        if (dx < 0) showLightboxAt((currentIdx + 1) % images.length);
        else showLightboxAt((currentIdx - 1 + images.length) % images.length);
      });
    }

    main();
  </script>
</body>
</html>
