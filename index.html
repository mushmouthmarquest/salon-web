<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>着物レンタル | leatorie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: #faf8f5;
      color: #2c2c2c;
    }

    /* ── ヘッダー ── */
    header {
      background: #fff;
      border-bottom: 1px solid #e8e0d8;
      padding: 20px 16px 16px;
      text-align: center;
    }

    .salon-label {
      font-family: 'Noto Serif JP', serif;
      font-size: 0.68rem;
      letter-spacing: 0.25em;
      color: #b8963e;
      margin-bottom: 6px;
    }

    header h1 {
      font-family: 'Noto Serif JP', serif;
      font-size: 1.2rem;
      font-weight: 600;
      color: #2c2c2c;
      letter-spacing: 0.1em;
    }

    /* ── 扉絵 ── */
    .hero-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      max-width: 480px;
      margin: 0 auto;
    }

    .hero-grid img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
    }

    .hero-wide {
      max-width: 480px;
      margin: 3px auto 0;
    }

    .hero-wide img {
      width: 100%;
      aspect-ratio: 47/20;
      object-fit: cover;
      display: block;
    }

    /* ── CTAボタン ── */
    .cta-wrap {
      padding: 28px 20px;
      text-align: center;
      max-width: 480px;
      margin: 0 auto;
    }

    .cta-btn {
      display: inline-block;
      background: #8b1a2f;
      color: #fff;
      text-decoration: none;
      font-family: 'Noto Serif JP', serif;
      font-size: 0.95rem;
      letter-spacing: 0.15em;
      padding: 14px 40px;
      border: none;
      position: relative;
    }

    .cta-btn::after {
      content: '';
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(255,255,255,0.4);
      pointer-events: none;
    }

    /* ── レンタルに関して ── */
    .rental-section {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 0 48px;
    }

    .rental-heading {
      font-family: 'Noto Serif JP', serif;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      color: #2c2c2c;
      padding: 16px 16px 12px;
      border-top: 1px solid #e8e0d8;
      border-bottom: 1px solid #e8e0d8;
      margin-bottom: 16px;
    }

    .rental-img {
      width: 100%;
      max-width: 480px;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <header>
    <div class="salon-label">KIMONO RENTAL</div>
    <h1>着物レンタル</h1>
  </header>

  <div class="hero-grid">
    <img src="images/top/hero1.jpg" alt="着物レンタル">
    <img src="images/top/hero2.jpg" alt="着物レンタル">
    <img src="images/top/hero3.jpg" alt="着物レンタル">
  </div>
  <div class="hero-wide">
    <img src="images/top/hero4.jpg" alt="leatorie">
  </div>

  <div class="cta-wrap">
    <a class="cta-btn" href="list.html">着物一覧を見る</a>
  </div>

  <div class="rental-section">
    <div class="rental-heading">レンタルに関して</div>
    <img class="rental-img" src="images/top/rental-size.jpg" alt="サイズの見方">
  </div>
</body>
</html>
