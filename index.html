<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>着物レンタル | leatorie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: #faf8f5;
      color: #2c2c2c;
    }

    /* ── ヘッダー ── */
    header {
      background: #fff;
      border-bottom: 1px solid #e8e0d8;
      padding: 20px 16px 16px;
      text-align: center;
    }

    .salon-label {
      font-family: 'Noto Serif JP', serif;
      font-size: 0.68rem;
      letter-spacing: 0.25em;
      color: #b8963e;
      margin-bottom: 6px;
    }

    header h1 {
      font-family: 'Noto Serif JP', serif;
      font-size: 1.2rem;
      font-weight: 600;
      color: #2c2c2c;
      letter-spacing: 0.1em;
    }

    /* ── 扉絵 ── */
    .hero-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      max-width: 480px;
      margin: 0 auto;
    }

    .hero-grid img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
    }

    .hero-wide {
      max-width: 480px;
      margin: 3px auto 0;
    }

    .hero-wide img {
      width: 100%;
      aspect-ratio: 47/20;
      object-fit: cover;
      display: block;
    }

    /* ── CTAボタン ── */
    .cta-wrap {
      padding: 28px 20px;
      text-align: center;
      max-width: 480px;
      margin: 0 auto;
    }

    .cta-btn {
      display: inline-block;
      background: #8b1a2f;
      color: #fff;
      text-decoration: none;
      font-family: 'Noto Serif JP', serif;
      font-size: 0.95rem;
      letter-spacing: 0.15em;
      padding: 14px 40px;
      border: none;
      position: relative;
    }

    .cta-btn::after {
      content: '';
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(255,255,255,0.4);
      pointer-events: none;
    }

    /* ── レンタルに関して ── */
    .rental-section {
      max-width: 480px;
      margin: 32px auto 0;
      padding: 0 0 48px;
    }

    .rental-heading {
      font-family: 'Noto Serif JP', serif;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      color: #2c2c2c;
      padding: 16px 16px 12px;
      border-top: 1px solid #e8e0d8;
      border-bottom: 1px solid #e8e0d8;
      margin-bottom: 16px;
    }

    .rental-img {
      width: 100%;
      max-width: 480px;
      display: block;
      margin: 0 auto;
    }

    /* ── カテゴリグリッド ── */
    .cat-section {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 0 48px;
    }

    .cat-heading {
      font-family: 'Noto Serif JP', serif;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      color: #2c2c2c;
      padding: 16px 16px 12px;
      border-top: 1px solid #e8e0d8;
      border-bottom: 1px solid #e8e0d8;
      margin-bottom: 16px;
    }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
    }

    .cat-card {
      display: block;
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
      background: #e8e0d8;
    }

    .cat-card img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .cat-card:hover img,
    .cat-card:active img {
      transform: scale(1.05);
    }

    .cat-card-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.45);
      color: #fff;
      font-family: 'Noto Serif JP', serif;
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      padding: 5px 4px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="salon-label">KIMONO RENTAL</div>
    <h1>着物レンタル</h1>
  </header>

  <div class="hero-grid">
    <img src="images/top/hero1.jpg" alt="着物レンタル">
    <img src="images/top/hero2.jpg" alt="着物レンタル">
    <img src="images/top/hero3.jpg" alt="着物レンタル">
  </div>
  <div class="hero-wide">
    <img src="images/top/hero4.jpg" alt="leatorie">
  </div>

  <!-- <div class="cta-wrap">
    <a class="cta-btn" href="list.html">着物一覧を見る</a>
  </div> -->

  <div class="rental-section">
    <div class="rental-heading">レンタルに関して</div>
    <img class="rental-img" src="images/top/rental-size.jpg" alt="サイズの見方">
  </div>

  <div class="cat-section">
    <div class="cat-heading">カテゴリから選ぶ</div>
    <div class="cat-grid" id="cat-grid"></div>
  </div>

  <script>
    (async () => {
      const CATEGORY_ORDER = [
        '1.2歳','お宮参り','七五三女の子','七五三男の子','被布スタイル',
        '訪問着・付け下げ・小紋','中振袖・振袖','留袖','卒業袴','羽織袴・着物','髪飾り','帯'
      ];
      const items = await fetch('kimono.json').then(r => r.json());
      const grid = document.getElementById('cat-grid');

      CATEGORY_ORDER.forEach(cat => {
        const item = items.find(i => i.category === cat);
        if (!item) return;

        const a = document.createElement('a');
        a.className = 'cat-card';
        a.href = 'list.html?category=' + encodeURIComponent(cat);

        const img = document.createElement('img');
        img.src = item.image;
        img.alt = cat;
        img.loading = 'lazy';

        const label = document.createElement('div');
        label.className = 'cat-card-label';
        label.textContent = cat;

        a.appendChild(img);
        a.appendChild(label);
        grid.appendChild(a);
      });
    })();
  </script>
</body>
</html>
