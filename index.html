<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>着物レンタル一覧</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #faf9f7;
      color: #333;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e8e0d8;
      padding: 16px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #5c3d2e;
      letter-spacing: 0.05em;
    }

    .category-tabs {
      display: flex;
      gap: 8px;
      padding: 16px 16px 0;
      overflow-x: auto;
    }

    .tab {
      flex-shrink: 0;
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid #c8b8a8;
      background: #fff;
      color: #5c3d2e;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .tab.active {
      background: #5c3d2e;
      color: #fff;
      border-color: #5c3d2e;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 16px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: transform 0.15s;
    }

    .card:active { transform: scale(0.97); }

    .card img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
    }

    .card-body {
      padding: 10px 12px 12px;
    }

    .card-name {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      background: #f0e6dc;
      color: #5c3d2e;
      border-radius: 4px;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌸 着物レンタル一覧</h1>
  </header>

  <div class="category-tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>

  <script>
    async function main() {
      const res = await fetch('kimono.json');
      const items = await res.json();

      const categories = [...new Set(items.map(i => i.category))];

      const tabs = document.getElementById('tabs');
      const grid = document.getElementById('grid');

      let active = categories[0];

      function render() {
        tabs.innerHTML = categories.map(c => `
          <button class="tab ${c === active ? 'active' : ''}" onclick="setActive('${c}')">${c}</button>
        `).join('');

        const filtered = items.filter(i => i.category === active);
        grid.innerHTML = filtered.map(item => `
          <div class="card" onclick="location.href='detail.html?id=${item.id}'">
            <img src="${item.image}" alt="${item.name}" loading="lazy">
            <div class="card-body">
              <div class="card-name">${item.name}</div>
              <span class="badge">${item.category}</span>
            </div>
          </div>
        `).join('');
      }

      window.setActive = function(cat) {
        active = cat;
        render();
      };

      render();
    }

    main();
  </script>
</body>
</html>
